<script>/* thème appliqué avant l'affichage : choix mémorisé, sinon réglage de l'appareil */(function(){var t;try{t=localStorage.getItem('tv_theme')}catch(e){}if(t!=='dark'&&t!=='light')t=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',t)})()</script>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
@font-face{font-family:"Soehne";src:url(assets/fonts/soehne-buch.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Soehne";src:url(assets/fonts/soehne-halbfett.woff2) format("woff2");font-weight:600;font-display:swap}

:root{
  --green:#05CE78; --web-green:#01AB61; --ruby:#E20076; --ink:#140D8A;
  --pink:#F385FF; --peach:#FF8867; --blue:#0053FF;
  --f-head:"Archivo","Soehne",Arial Black,sans-serif;
  --f-body:"Soehne",Arial,sans-serif;
  --glass:rgba(255,255,255,.55); --glass-b:rgba(255,255,255,.75);
  --r:28px; --gutter:clamp(16px,5vw,72px); --maxw:1240px; --p:0;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%;scroll-padding-top:100px;overflow-x:clip}
body{font-family:var(--f-body);color:var(--ink);line-height:1.55;overflow-x:hidden;background:#FFE3D8}
img{display:block;max-width:100%}
a{color:inherit}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:10px}
.wrap{max-width:var(--maxw);margin-inline:auto;padding-inline:var(--gutter)}
.h{font-family:var(--f-head);font-weight:900;font-stretch:125%;line-height:.92;letter-spacing:-.01em}
.g{color:var(--web-green)}
.center{text-align:center}
.ref{font-size:.76rem;font-weight:600;opacity:.65}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Ciel ---------- */
.sky{position:fixed;inset:0;z-index:-2;
  background:
    radial-gradient(60vmax 50vmax at calc(15% + var(--p)*30%) calc(10% + var(--p)*20%),rgba(243,133,255,calc(.5 - var(--p)*.3)),transparent 70%),
    radial-gradient(55vmax 45vmax at calc(90% - var(--p)*20%) 20%,rgba(255,136,103,calc(.5 - var(--p)*.35)),transparent 70%),
    radial-gradient(70vmax 60vmax at 50% calc(110% - var(--p)*40%),rgba(5,206,120,calc(.25 + var(--p)*.35)),transparent 70%),
    radial-gradient(60vmax 50vmax at calc(80% - var(--p)*10%) calc(70% - var(--p)*30%),rgba(0,83,255,calc(.16 + var(--p)*.24)),transparent 70%),
    linear-gradient(180deg,#FFE9E0,#F3ECFF 50%,#E6F7FF)}
.cloud{position:fixed;z-index:-1;border-radius:50%;background:#fff;filter:blur(30px);opacity:.7;pointer-events:none}
.c1{width:420px;height:150px;left:-80px;top:30%}.c2{width:520px;height:170px;right:-120px;top:65%}

.glass{background:var(--glass);backdrop-filter:blur(22px) saturate(1.4);-webkit-backdrop-filter:blur(22px) saturate(1.4);border:1.5px solid var(--glass-b);border-radius:var(--r);box-shadow:0 26px 50px -30px rgba(20,13,138,.35)}
.btn{display:inline-flex;align-items:center;gap:.55em;padding:.9em 1.4em;border-radius:999px;font-weight:600;text-decoration:none;transition:transform .25s cubic-bezier(.2,.9,.3,1.3)}
.btn:hover{transform:translateY(-2px) scale(1.03)}
.btn-ruby{background:var(--ruby);color:#fff;box-shadow:0 12px 30px -10px rgba(226,0,118,.7)}
.btn-ink{background:var(--ink);color:#fff}
.btn-glass{background:rgba(255,255,255,.7);border:1.5px solid #fff}
.btn-sm{padding:.55em .95em;font-size:.85rem}
.chip{display:inline-flex;align-items:center;gap:.5em;padding:.4em .9em;border-radius:999px;background:rgba(255,255,255,.7);border:1.5px solid #fff;font-weight:600;font-size:.82rem}
.chip i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(5,206,120,.25)}

.nav{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:60;display:flex;align-items:center;gap:4px;padding:6px;border-radius:999px;width:max-content;max-width:calc(100% - 24px)}
.nav img{width:40px;height:40px}
.nav a.l{text-decoration:none;font-weight:600;font-size:.9rem;padding:.6em 1em;border-radius:999px}
.nav a.l:hover{background:rgba(255,255,255,.7)}
.nav a.l[aria-current="page"]{background:var(--ink);color:#fff}
.nav .btn{padding:.7em 1.2em;font-size:.9rem}
@media (max-width:1000px){.nav a.l:not([aria-current]){display:none}}

.xl .w{display:inline-block;white-space:nowrap}
.xl .ch{display:inline-block;animation:pop .9s cubic-bezier(.2,.9,.3,1.3) both;animation-delay:calc(var(--i)*30ms)}
@keyframes pop{from{opacity:0;transform:translateY(.4em) scaleY(.4)}}
.rv{opacity:0;transform:translateY(30px);transition:opacity .7s,transform .7s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

/* ---------- Haut de page ---------- */
.top{padding-top:120px;text-align:center}
.top h1{font-size:clamp(2.6rem,8vw,6.4rem);margin-top:16px}
.top .lead{font-size:clamp(1.05rem,1.6vw,1.3rem);max-width:44ch;margin:16px auto 0}

[hidden]{display:none!important}

footer{padding:0 0 36px}
footer .bar{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:18px 28px;border-radius:999px}
footer img{height:20px;width:auto}
footer nav{display:flex;gap:18px;flex-wrap:wrap;font-weight:600;font-size:.85rem}
@media (max-width:760px){footer .bar{border-radius:24px}}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,calc(100% + 40px));visibility:hidden;background:rgba(255,255,255,.9);backdrop-filter:blur(14px);padding:12px 22px;border-radius:999px;font-weight:600;z-index:90;box-shadow:0 14px 30px -12px rgba(20,13,138,.4);transition:transform .4s cubic-bezier(.2,.9,.3,1.3)}
.toast.show{transform:translate(-50%,0);visibility:visible}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}.rv{opacity:1;transform:none}}
</style>
